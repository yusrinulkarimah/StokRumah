<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6fbff"><link rel="manifest" href="manifest.json"><title>Stok Rumah</title>
<style>
:root{--bg:#f6fbff;--card:#fff;--ink:#10244b;--muted:#71809c;--line:#dce8f7;--blue:#1877f2;--safe:#21a366;--warn:#f59e0b;--danger:#ef4444;--shadow:0 8px 24px rgba(39,93,147,.08)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8fcff,#eef7ff);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}.app{max-width:460px;margin:auto;min-height:100vh;background:rgba(255,255,255,.68);padding-bottom:88px}header{position:sticky;top:0;z-index:15;padding:18px 18px 10px;background:rgba(248,252,255,.93);backdrop-filter:blur(12px)}.head{display:flex;align-items:center;justify-content:space-between}.head h1{margin:0;font-size:29px}.head-icons{display:flex;gap:10px}#searchBtn,#plusBtn,#filterBtn{display:none}.icon-btn{width:42px;height:42px;border:0;border-radius:14px;background:#fff;color:#173b70;display:grid;place-items:center;box-shadow:var(--shadow)}svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.screen{display:none;padding:0 18px 24px}.screen.active{display:block}
.hero{display:flex;align-items:center;justify-content:space-between;padding:18px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,#fff,#f0f8ff);box-shadow:var(--shadow)}.hero h2{margin:0;color:#1769d2}.house{font-size:52px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 18px}.metric{padding:15px 8px;border:1px solid var(--line);border-radius:18px;text-align:center;background:#fff;box-shadow:var(--shadow)}.metric b{display:block;font-size:26px}.metric small{color:var(--muted)}.section-title{display:flex;justify-content:space-between;margin:19px 2px 10px;font-weight:800;font-size:16px}
.summary-card{display:flex;align-items:center;gap:13px;padding:15px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow);margin-bottom:10px}.summary-card.click{cursor:pointer}.round{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:#eef6ff}.grow{flex:1}.summary-card small{color:var(--muted)}
.categories{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cat{padding:16px 8px;border:1px solid var(--line);border-radius:18px;background:#fff;text-align:center;box-shadow:var(--shadow)}.cat .ico{font-size:28px}.cat small{color:var(--muted)}
.tabs{display:flex;gap:8px;overflow:auto;padding:3px 0 8px}.tab{border:1px solid var(--line);background:#fff;color:#35537b;padding:9px 13px;border-radius:12px;white-space:nowrap}.tab.on{background:var(--blue);color:#fff}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px;color:#4c6283}.toolbar select{border:0;background:transparent;color:#1769d2;font-weight:700}.list{display:flex;flex-direction:column;gap:9px}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:var(--shadow)}
.stock-table{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow)}
.stock-head,.stock-tr{min-width:690px;display:grid;grid-template-columns:150px 58px 58px 72px 100px 65px 105px 80px;align-items:center}
.stock-head{padding:11px 10px;background:#f2f7fc;color:#536b8a;font-size:11px;font-weight:800}
.stock-tr{padding:10px;border-top:1px solid #eaf0f7;font-size:12px}.stock-tr .name{font-weight:800;cursor:pointer}.stock-tr .cell{text-align:center}
.stock-actions{display:flex;gap:6px;justify-content:flex-end}.mini-edit,.mini-trash{width:30px;height:30px;border:0;border-radius:9px;display:grid;place-items:center}.mini-edit{background:#eaf4ff;color:#1877f2}.mini-trash{background:#fff0f2;color:#ef4455}
.stock-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:10px 0 13px}.stock-summary>div{text-align:center;border-radius:17px;padding:13px 6px}.stock-summary b{display:block;font-size:22px}.ss-low{background:#fff1f3;color:#e43d55}.ss-thin{background:#fff7eb;color:#dc7a00}.ss-safe{background:#ecf9f4;color:#07875d}.shop-check{width:21px;height:21px;accent-color:var(--blue);cursor:pointer}
.shop-row{grid-template-columns:32px 1fr auto}
.row-main{cursor:pointer}.row-main b{font-size:15px}.row-main small{display:block;color:var(--muted);margin-top:2px}.row-actions{display:flex;align-items:center;gap:10px}.trash{border:0;background:transparent;color:#9aa8bc;padding:5px}.badge{display:inline-flex;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700;margin-left:6px}.safe{background:#eaf8f0;color:var(--safe)}.warn-b{background:#fff4dc;color:#bf7300}.danger-b{background:#ffe9e9;color:#d72f2f}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed #bfd2ea;border-radius:18px}.add-wide{width:100%;margin-top:14px;border:0;border-radius:15px;padding:14px;background:var(--blue);color:#fff;font-weight:800}.hist-tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:13px;padding:3px;background:#fff;margin-bottom:14px}.hist-tabs button{border:0;border-radius:10px;background:transparent;padding:10px;color:#59708e}.hist-tabs button.on{background:var(--blue);color:#fff}.hist-group h4{color:#1769d2}.hist-row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:13px 4px;border-bottom:1px solid #edf2f8}.hist-row small{color:var(--muted)}.in{color:var(--safe)!important;font-weight:800}.out{color:var(--danger)!important;font-weight:800}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:460px;width:100%;z-index:30;padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:rgba(255,255,255,.95);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr)}.nav{border:0;background:transparent;color:#536b8a;font-size:11px;display:grid;gap:4px;place-items:center}.nav.on{color:var(--blue);font-weight:800}
.overlay{position:fixed;inset:0;background:rgba(20,42,73,.28);z-index:50;display:none;align-items:flex-end;justify-content:center}.overlay.on{display:flex}.sheet{width:min(460px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:18px 18px 28px}.sheet-head{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#eef4fb;border-radius:12px;width:38px;height:38px}.detail-grid{display:grid;grid-template-columns:1fr auto;gap:12px;padding:15px;border:1px solid var(--line);border-radius:16px;background:#fbfdff}.detail-grid div:nth-child(odd){color:#667892}.detail-grid div:nth-child(even){font-weight:700;text-align:right}.controls{display:grid;grid-template-columns:46px 1fr 46px;gap:8px;margin:12px 0}.controls button{border:1px solid var(--line);background:#fff;border-radius:13px;font-size:22px;color:var(--blue)}.controls input{text-align:center;border:1px solid var(--line);border-radius:13px;font-weight:800;font-size:19px;padding:12px}.quick{display:flex;gap:7px;flex-wrap:wrap}.quick button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;color:#1769d2}.form-grid{display:grid;gap:12px}.field label{display:block;color:#586d8a;font-size:12px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #ccdced;border-radius:13px;padding:12px;background:#fff}.field textarea{min-height:86px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:grid;gap:9px;margin-top:15px}.primary,.secondary,.danger{border-radius:14px;padding:13px;font-weight:800}.primary{border:0;background:var(--blue);color:#fff}.secondary{border:1px solid var(--line);background:#fff;color:#1769d2}.danger{border:1px solid #ffc4c4;background:#fff7f7;color:var(--danger)}.hidden{display:none!important}
.booting .app{visibility:hidden}
</style></head>
<body class="booting"><div class="app"><header><div class="head"><h1 id="pageTitle">Beranda</h1><div class="head-icons"><button class="icon-btn" id="searchBtn"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.3-3.3"/></svg></button><button class="icon-btn" id="plusBtn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><button class="icon-btn" id="filterBtn"><svg viewBox="0 0 24 24"><path d="M4 5h16l-6 7v5l-4 2v-7z"/></svg></button></div></div></header>
<main>
<section id="home" class="screen active">
<div class="hero"><div><h2>Halo, Ibu 👋</h2><small id="todayText"></small></div><div class="house">🏡</div></div>
<div class="section-title">Kategori</div><div class="categories" id="catGrid"></div>
<div class="section-title" style="margin-top:24px">Status Stok</div>
<div class="metrics"><div class="metric"><span>📦</span><b id="mTotal">0</b><small>Total Barang</small></div><div class="metric"><span>⚠️</span><b id="mLow">0</b><small>Hampir Habis</small></div><div class="metric"><span>⛔</span><b id="mOut">0</b><small>Habis</small></div></div>
<div class="section-title">Ringkasan</div>
<div class="summary-card click" id="goLow"><div class="round">🛒</div><div class="grow"><b id="lowText"></b></div><div>›</div></div>
<div class="summary-card click" id="goExpiry"><div class="round">🗓️</div><div class="grow"><b id="expiryText"></b></div><div>›</div></div>
</section>
<section id="stock" class="screen"><div class="tabs" id="stockTabs"></div><div class="stock-summary"><div class="ss-low" data-stockstatus="low" style="cursor:pointer"><b id="ssLow">0</b><small>Hampir Habis</small></div><div class="ss-thin" data-stockstatus="out" style="cursor:pointer"><b id="ssThin">0</b><small>Habis</small></div><div class="ss-safe" data-stockstatus="safe" style="cursor:pointer"><b id="ssSafe">0</b><small>Aman</small></div></div><div class="toolbar"><span>Urutkan: <select id="stockSort"><option value="category">Kategori</option><option value="name">Nama</option><option value="low">Stok menipis</option><option value="expiry">Kedaluwarsa</option></select></span><span id="stockCount"></span></div><div class="stock-table"><div class="stock-head"><div>Nama Barang</div><div>Stok</div><div>Min.</div><div>Satuan</div><div>Exp</div><div>PAO</div><div>Status</div><div></div></div><div id="stockList"></div></div></section>
<section id="shop" class="screen">
<div class="toolbar"><span>Urutkan: <select id="shopSort"><option value="priority">Prioritas</option><option value="name">Nama</option><option value="category">Kategori</option></select></span></div>
<div class="section-title"><span>Belum Dibeli</span><span id="shopPending"></span></div>
<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 2px 12px;color:#536b8a;border-bottom:1px solid var(--line);margin-bottom:10px"><span>Perkiraan total</span><b id="shopTotal" style="color:#10244b">Rp 0</b></div>
<div class="list" id="shopList"></div>
<button class="add-wide" id="saveShoppingBtn">Simpan Belanja</button>
</section>
<section id="history" class="screen"><div class="hist-tabs"><button id="histShopBtn" class="on">Riwayat Belanja</button><button id="histStockBtn">Riwayat Stok</button></div><div id="historyContent"></div></section>
<section id="more" class="screen"><div class="summary-card"><div class="round">🏠</div><div class="grow"><b>Stok Rumah</b><small>Data tersimpan di perangkat ini</small></div></div><button class="secondary" style="width:100%;margin-top:12px" id="resetDemo">Reset ke Data Contoh</button></section>
</main>
<nav class="bottom"><button class="nav on" data-screen="home"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>Beranda</span></button><button class="nav" data-screen="stock"><svg viewBox="0 0 24 24"><path d="m12 3 8 4-8 4-8-4z"/><path d="M4 7v10l8 4 8-4V7"/></svg><span>Stok</span></button><button class="nav" data-screen="shop"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 10.5a2 2 0 0 0 2 1.5H18a2 2 0 0 0 2-1.6L21 8H6"/></svg><span>Belanja</span></button><button class="nav" data-screen="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Riwayat</span></button><button class="nav" data-screen="more"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Lainnya</span></button></nav></div><div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<script src="./app.js?v=2.4" defer></script>
</body></html>
